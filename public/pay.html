<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pay · Flow</title>
<script src="/flow-store.js"></script>
<style>
  * { box-sizing: border-box; }
  :root {
    --surface: #FFFFFF; --panel: #F6F6F8; --line: rgba(18,18,24,.1);
    --ink: #121217; --ink-3: #5C5C68; --ink-4: #7C7C88; --ink-5: #9B9BA6;
    --on-block: #FFFFFF; --btn-dark: linear-gradient(315deg,#3B4058 0%,#262A3B 48%,#17181F 100%);
    --pos: #3D7D66;
  }
  html, body { margin: 0; min-height: 100%; background: #F2F2F5; color: var(--ink);
    font-family: Urbanist, Cairo, system-ui, sans-serif; }
  .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
  .card { width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; padding: 32px 28px; box-shadow: 0 18px 40px -30px rgba(10,10,16,.45); }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; display: flex;
    align-items: center; justify-content: center; font-size: 11px; font-weight: 650; color: var(--ink-5);
    border: 1px dashed var(--line); background: var(--panel); overflow: hidden; }
  .logo img { width: 100%; height: 100%; object-fit: cover; }
  .biz { font-size: 14px; font-weight: 650; }
  h1 { margin: 22px 0 8px; font-size: 26px; letter-spacing: -.03em; }
  .desc { font-size: 13.5px; color: var(--ink-3); line-height: 1.55; }
  .price { margin-top: 22px; font-size: 32px; font-weight: 600; letter-spacing: -.03em; }
  .cur { font-size: 13px; color: var(--ink-4); margin-top: 4px; }
  button { width: 100%; margin-top: 24px; padding: 13px 16px; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 650; color: var(--on-block); background: var(--btn-dark); cursor: pointer; }
  button[disabled] { opacity: .55; cursor: default; }
  .note { margin-top: 16px; font-size: 12px; color: var(--ink-4); line-height: 1.5; }
  .ok { color: var(--pos); font-weight: 650; }
  .err { color: #C0453E; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="card">
      <div class="note">Loading checkout…</div>
    </div>
  </div>
<script>
(function () {
  var parts = location.pathname.split("/").filter(Boolean);
  var slug = parts[0] === "pay" && parts[1] ? parts[1] : new URLSearchParams(location.search).get("slug");
  var card = document.getElementById("card");
  function money(minor) {
    return "QR " + (minor / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function show(html) { card.innerHTML = html; }
  if (typeof FlowStore === "undefined" || !FlowStore.checkoutPageBySlug) {
    show('<div class="err">Checkout is not available.</div>');
    return;
  }
  if (FlowStore.hydrateFromStorage) FlowStore.hydrateFromStorage();
  var page = slug ? FlowStore.checkoutPageBySlug(slug) : null;
  if (!page) {
    show('<h1>Page not found</h1><div class="desc">This checkout link is not published, or it was created in another browser profile.</div>');
    return;
  }
  var logo = page.logoDataUrl
    ? '<img src="' + page.logoDataUrl + '" alt="">'
    : 'Logo';
  var merchant = (FlowStore.dashboardState && FlowStore.dashboardState().merchantName) || "Al Bidda Trading W.L.L.";
  show(
    '<div class="brand"><span class="logo" style="border-color:' + (page.accent || "#17171C") + '">' + logo + '</span>' +
    '<div class="biz">' + merchant + '</div></div>' +
    '<h1>' + page.productName + '</h1>' +
    (page.description ? '<div class="desc">' + page.description + '</div>' : '') +
    '<div class="price">' + money(page.amountMinor) + '</div>' +
    '<div class="cur">QAR</div>' +
    '<button id="pay">Pay ' + money(page.amountMinor) + '</button>' +
    '<div class="note">Simulated checkout. Money movement uses the sandbox gateway.</div>'
  );
  document.getElementById("pay").onclick = function () {
    var btn = this;
    btn.disabled = true;
    btn.textContent = "Processing…";
    FlowStore.payPublishedCheckout(page.slug).then(function (result) {
      if (!result || !result.pending) {
        btn.disabled = false;
        btn.textContent = "Pay " + money(page.amountMinor);
        show(card.innerHTML + '<div class="note err">Payment was not recorded.</div>');
        return;
      }
      var delay = result.delayMs || 1200;
      setTimeout(function () {
        if (FlowStore.settleCheckoutPayment) FlowStore.settleCheckoutPayment(result.txnId);
        show(
          '<div class="brand"><span class="logo">' + logo + '</span><div class="biz">' + merchant + '</div></div>' +
          '<h1>Paid</h1><div class="desc">' + page.productName + '</div>' +
          '<div class="price">' + money(page.amountMinor) + '</div>' +
          '<div class="note ok">Payment settled. It now appears in Money In.</div>'
        );
      }, delay);
    }).catch(function () {
      btn.disabled = false;
      btn.textContent = "Pay " + money(page.amountMinor);
    });
  };
})();
</script>
</body>
</html>
